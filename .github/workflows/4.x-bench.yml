name: 4.x Benchmarks (advisory)

on:
  pull_request:
    branches: ['4.x']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base 4.x
        uses: actions/checkout@v4
        with:
          ref: 4.x
          path: base

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          tools: composer:latest

      - name: Install deps (base)
        working-directory: base
        run: composer install --no-interaction --prefer-dist

      - name: Install deps (head)
        working-directory: head
        run: composer install --no-interaction --prefer-dist

      # The PR that introduces this workflow also introduces composer bench:*.
      # Until that PR merges, the base branch can't be benchmarked the same way,
      # so we degrade to a head-only run instead of failing the workflow.
      - name: Detect bench scripts on base
        id: base_caps
        working-directory: base
        run: |
          if composer run-script --list 2>/dev/null | grep -qE '^\s*bench:baseline\b'; then
            echo "has_bench=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_bench=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Base 4.x does not yet expose composer bench:baseline — running head-only."
          fi

      - name: Run baseline on 4.x
        if: steps.base_caps.outputs.has_bench == 'true'
        working-directory: base
        run: composer bench:baseline

      # `--ref=baseline` in bench:compare resolves through PHPBench's local
      # storage (.phpbench/), not the dumped XML. Sync both so the head
      # working directory can resolve the baseline tag and ref.
      - name: Sync baseline storage + dump into head
        if: steps.base_caps.outputs.has_bench == 'true'
        run: |
          cp -r base/.phpbench head/.phpbench
          cp base/phpbench-baseline.xml head/phpbench-baseline.xml

      - name: Compare head vs baseline
        if: steps.base_caps.outputs.has_bench == 'true'
        working-directory: head
        continue-on-error: true
        run: |
          set -o pipefail
          composer bench:compare 2>&1 | tee phpbench-report.txt

      - name: Run head-only (no comparable baseline yet)
        if: steps.base_caps.outputs.has_bench != 'true'
        working-directory: head
        continue-on-error: true
        run: |
          set -o pipefail
          composer bench 2>&1 | tee phpbench-report.txt

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpbench-results
          path: |
            head/phpbench-baseline.xml
            head/phpbench-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          MODE: ${{ steps.base_caps.outputs.has_bench == 'true' && 'compare' || 'head-only' }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('head/phpbench-report.txt', 'utf8');
            const baseSha = context.payload.pull_request.base.sha.slice(0, 7);
            const headSha = context.payload.pull_request.head.sha.slice(0, 7);
            const mode = process.env.MODE;
            const heading = mode === 'compare'
              ? `Baseline: \`origin/4.x\` @ ${baseSha}\nHead: ${headSha}`
              : `Head: ${headSha}\n_(no comparable baseline on \`origin/4.x\` yet — head-only run)_`;
            const body = [
              '## PHPBench (advisory)',
              '',
              heading,
              '',
              '<details><summary>Aggregate report</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>',
              '',
              '_This job is advisory and does not block merge. The full XML is attached to the workflow run as an artifact._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
